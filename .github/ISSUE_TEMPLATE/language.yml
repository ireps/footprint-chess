name: A new language
description: Offer to add a language for the voice lines.
labels: [language]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. A language needs every voice line written for young children in that language (not translated word for word), and ideally recorded clips. See docs/LANGUAGES.md for the steps.
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: textarea
    id: words
    attributes:
      label: The chess words
      description: The usual children's words for king, queen, rook, bishop, knight, pawn, capture, check and checkmate in this language, and for "the other side" and "your side".
    validations:
      required: true
  - type: checkboxes
    id: voice
    attributes:
      label: Voice clips
      options:
        - label: I can record the clips myself, or have a voice whose recordings can be shared under this project's license.
