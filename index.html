<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#bfeee8">
<title>Footprint Chess</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Robots theme (decoration only; every piece is always shown and
         spoken of by its real chess name). Silhouettes keep the real chess
         shapes so children can recognise them on a real board later. -->
    <symbol id="robots-r" viewBox="0 0 100 100">
      <g stroke="#1d2b36" stroke-width="3" stroke-linejoin="round">
        <rect x="16" y="78" width="68" height="13" rx="6.5" fill="#34434f"/>
        <path d="M22 78 V14 H34 V22 H44 V14 H56 V22 H66 V14 H78 V78 Z" fill="#f59e2e"/>
        <rect x="30" y="36" width="40" height="22" rx="6" fill="#1d2b36"/>
      </g>
      <circle cx="42" cy="47" r="4.5" fill="#8ff3ff"/>
      <circle cx="58" cy="47" r="4.5" fill="#8ff3ff"/>
      <circle cx="30" cy="68" r="2.5" fill="#1d2b36"/>
      <circle cx="70" cy="68" r="2.5" fill="#1d2b36"/>
      <g fill="#8da2b3"><circle cx="27" cy="84.5" r="3"/><circle cx="42" cy="84.5" r="3"/><circle cx="58" cy="84.5" r="3"/><circle cx="73" cy="84.5" r="3"/></g>
    </symbol>

    <symbol id="robots-b" viewBox="0 0 100 100">
      <g stroke="#1d2b36" stroke-width="3" stroke-linejoin="round">
        <rect x="22" y="78" width="56" height="13" rx="6.5" fill="#34434f"/>
        <rect x="30" y="63" width="40" height="15" rx="5" fill="#ec5f99"/>
        <path d="M50 14 C68 24 72 46 68 63 H32 C28 46 32 24 50 14 Z" fill="#ec5f99"/>
        <circle cx="50" cy="11" r="5" fill="#ffe066"/>
        <rect x="37" y="42" width="26" height="14" rx="5" fill="#1d2b36"/>
      </g>
      <path d="M44 34 L58 23" stroke="#1d2b36" stroke-width="5" stroke-linecap="round" fill="none"/>
      <circle cx="45" cy="49" r="3.2" fill="#8ff3ff"/>
      <circle cx="55" cy="49" r="3.2" fill="#8ff3ff"/>
    </symbol>

    <symbol id="robots-q" viewBox="0 0 100 100">
      <g stroke="#1d2b36" stroke-width="3" stroke-linejoin="round">
        <rect x="20" y="78" width="60" height="13" rx="6.5" fill="#34434f"/>
        <path d="M28 40 H72 L68 78 H32 Z" fill="#9a6ce0"/>
        <path d="M24 42 L28 17 L40 30 L50 13 L60 30 L72 17 L76 42 Z" fill="#9a6ce0"/>
        <circle cx="28" cy="15" r="4.5" fill="#ffe066"/>
        <circle cx="50" cy="11" r="4.5" fill="#ffe066"/>
        <circle cx="72" cy="15" r="4.5" fill="#ffe066"/>
        <rect x="35" y="46" width="30" height="17" rx="5" fill="#1d2b36"/>
      </g>
      <circle cx="44" cy="52" r="3.2" fill="#8ff3ff"/>
      <circle cx="56" cy="52" r="3.2" fill="#8ff3ff"/>
      <path d="M45 58 Q50 61 55 58" stroke="#8ff3ff" stroke-width="2" stroke-linecap="round" fill="none"/>
    </symbol>

    <symbol id="robots-k" viewBox="0 0 100 100">
      <g stroke="#1d2b36" stroke-width="3" stroke-linejoin="round">
        <rect x="20" y="78" width="60" height="13" rx="6.5" fill="#34434f"/>
        <path d="M46 3 H54 V8 H60 V15 H54 V20 H46 V15 H40 V8 H46 Z" fill="#f5d23b"/>
        <path d="M28 36 V22 L37 28 L50 19 L63 28 L72 22 V36 Z" fill="#f5d23b"/>
        <rect x="26" y="34" width="48" height="44" rx="10" fill="#f5d23b"/>
        <rect x="33" y="44" width="34" height="18" rx="6" fill="#1d2b36"/>
      </g>
      <path d="M38 52 Q42 56 46 52 M54 52 Q58 56 62 52" stroke="#8ff3ff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M79 22 H86 L79 30 H86" stroke="#1d2b36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </symbol>

    <symbol id="robots-n" viewBox="0 0 100 100">
      <rect x="22" y="80" width="56" height="11" rx="5.5" fill="#34434f" stroke="#1d2b36" stroke-width="3"/>
      <path d="M38 63 L62 67 L38 71 L62 75 L38 80" stroke="#1d2b36" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M38 63 L62 67 L38 71 L62 75 L38 80" stroke="#8da2b3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M30 63 V40 C30 24 40 14 54 14 L58 5 L64 14 C74 20 80 30 80 40 L74 46 L62 42 L60 63 Z" fill="#36c2ce" stroke="#1d2b36" stroke-width="3" stroke-linejoin="round"/>
      <path d="M36 30 L42 26 M34 40 L41 36 M34 50 L41 46" stroke="#1d2b36" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="62" cy="28" r="5.5" fill="#1d2b36"/>
      <circle cx="62" cy="28" r="2.6" fill="#8ff3ff"/>
      <circle cx="74" cy="39" r="2" fill="#1d2b36"/>
    </symbol>

    <symbol id="robots-p" viewBox="0 0 100 100">
      <g stroke="#1d2b36" stroke-width="3" stroke-linejoin="round">
        <rect x="22" y="78" width="56" height="13" rx="6.5" fill="#34434f"/>
        <path d="M34 52 H66 L71 78 H29 Z" fill="#6ccb5f"/>
        <path d="M50 17 V9" fill="none"/>
        <circle cx="50" cy="7" r="4" fill="#ffe066"/>
        <circle cx="50" cy="34" r="17" fill="#6ccb5f"/>
        <rect x="37" y="27" width="26" height="14" rx="7" fill="#1d2b36"/>
      </g>
      <circle cx="44" cy="34" r="3.5" fill="#8ff3ff"/>
      <circle cx="56" cy="34" r="3.5" fill="#8ff3ff"/>
    </symbol>

    <!-- Opponent pawn: the pawn robot in dark ("the other side") colours. -->
    <symbol id="robots-p-dark" viewBox="0 0 100 100">
      <g stroke="#11161f" stroke-width="3" stroke-linejoin="round">
        <rect x="22" y="78" width="56" height="13" rx="6.5" fill="#222a36"/>
        <path d="M34 52 H66 L71 78 H29 Z" fill="#4a5466"/>
        <circle cx="50" cy="7" r="4" fill="#8d99ab"/>
        <circle cx="50" cy="34" r="17" fill="#4a5466"/>
        <rect x="37" y="27" width="26" height="14" rx="7" fill="#11161f"/>
      </g>
      <circle cx="44" cy="34" r="3.5" fill="#c9d4e3"/>
      <circle cx="56" cy="34" r="3.5" fill="#c9d4e3"/>
    </symbol>

    <!-- Classic piece silhouettes (original drawings), filled with currentColor:
         the small badge shown with every robot so its real chess shape is
         always visible too. -->
    <symbol id="cl-p" viewBox="0 0 100 100"><path d="M28 90 H72 Q72 82 64 80 L58 58 H65 Q65 52 58 51 A15 15 0 1 0 42 51 Q35 52 35 58 H42 L36 80 Q28 82 28 90 Z" fill="currentColor"/></symbol>
    <symbol id="cl-r" viewBox="0 0 100 100"><path d="M26 90 H74 V82 H68 L64 44 H70 V18 H61 V27 H55 V18 H45 V27 H39 V18 H30 V44 H36 L32 82 H26 Z" fill="currentColor"/></symbol>
    <symbol id="cl-b" viewBox="0 0 100 100"><path d="M28 90 H72 V82 H64 L58 64 H64 V58 H60 C70 48 66 30 50 18 C34 30 30 48 40 58 H36 V64 H42 L36 82 H28 Z" fill="currentColor"/><circle cx="50" cy="12" r="6" fill="currentColor"/><path d="M47 42 L57 30" stroke="#fff" stroke-width="4" stroke-linecap="round"/></symbol>
    <symbol id="cl-q" viewBox="0 0 100 100"><path d="M26 90 H74 V82 H68 L62 50 L76 26 L60 38 L50 18 L40 38 L24 26 L38 50 L32 82 H26 Z" fill="currentColor"/><circle cx="24" cy="24" r="5" fill="currentColor"/><circle cx="50" cy="14" r="5" fill="currentColor"/><circle cx="76" cy="24" r="5" fill="currentColor"/></symbol>
    <symbol id="cl-k" viewBox="0 0 100 100"><path d="M26 90 H74 V82 H68 L62 52 H68 C72 40 62 32 50 34 C38 32 28 40 32 52 H38 L32 82 H26 Z" fill="currentColor"/><path d="M46 6 H54 V14 H62 V22 H54 V32 H46 V22 H38 V14 H46 Z" fill="currentColor"/></symbol>
    <symbol id="cl-n" viewBox="0 0 100 100"><path d="M28 90 H72 V82 H67 L65 60 C76 50 77 34 65 22 C59 16 52 14 45 15 L40 7 L35 19 C27 25 23 36 25 47 L34 51 L45 45 C45 53 37 60 35 70 L33 82 H28 Z" fill="currentColor"/><circle cx="46" cy="28" r="3.5" fill="#fff"/></symbol>

    <symbol id="ic-sound-on" viewBox="0 0 100 100">
      <path d="M16 38 H34 L56 18 V82 L34 62 H16 Z" fill="currentColor"/>
      <path d="M68 34 Q78 50 68 66 M78 24 Q94 50 78 76" stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none"/>
    </symbol>

    <symbol id="ic-sound-off" viewBox="0 0 100 100">
      <path d="M16 38 H34 L56 18 V82 L34 62 H16 Z" fill="currentColor"/>
      <path d="M68 38 L88 62 M88 38 L68 62" stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none"/>
    </symbol>

    <!-- Ghost hand: a pointing hand, index finger up, fingertip at the top
         centre of the viewBox so js/board.js can land it exactly on a
         square centre. -->
    <symbol id="ic-hand" viewBox="0 0 100 100">
      <g stroke="#1d2b36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <rect x="42" y="4" width="16" height="44" rx="8" fill="#ffffff"/>
        <path d="M31 38 C31 33 35 29 40 29 H60 C72 29 81 39 81 52 V68 C81 83 69 95 53 95 H47 C35 95 25 88 20 77 L12 60 C9 53 12 46 18 44 C23 42 29 45 32 51 L36 60 V38 Z" fill="#ffffff"/>
      </g>
    </symbol>

    <symbol id="ic-skip" viewBox="0 0 100 100">
      <path d="M13 20 L50 50 L13 80 Z" fill="currentColor"/>
      <path d="M50 20 L87 50 L50 80 Z" fill="currentColor"/>
    </symbol>

    <!-- Tools: replay ("again"), home, play/go, meet-card arrow. -->
    <symbol id="again" viewBox="0 0 100 100"><path d="M76 50 A26 26 0 1 1 64 28" stroke="currentColor" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M52 12 L78 22 L62 44 Z" fill="currentColor"/></symbol>
    <symbol id="house" viewBox="0 0 100 100"><path d="M14 50 L50 16 L86 50 V86 H60 V62 H40 V86 H14 Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/></symbol>
    <symbol id="play-tri" viewBox="0 0 100 100"><path d="M24 12 L88 50 L24 88 Z" fill="currentColor" stroke="currentColor" stroke-width="10" stroke-linejoin="round"/></symbol>
    <symbol id="arrow" viewBox="0 0 100 100"><path d="M14 50 H74 M56 28 L80 50 L56 72" stroke="currentColor" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="blob blob-a" aria-hidden="true"></div>
<div class="blob blob-b" aria-hidden="true"></div>
<div class="blob blob-c" aria-hidden="true"></div>

<main class="app" id="app">
  <section class="scene" aria-label="Board">
    <div class="strip strip-far" id="strip-far" aria-hidden="true">
      <svg class="cl-icon"><use href="#cl-r"/></svg>
      <svg class="cl-icon"><use href="#cl-n"/></svg>
      <svg class="cl-icon"><use href="#cl-b"/></svg>
      <svg class="cl-icon"><use href="#cl-q"/></svg>
      <svg class="cl-icon"><use href="#cl-k"/></svg>
      <svg class="cl-icon"><use href="#cl-b"/></svg>
      <svg class="cl-icon"><use href="#cl-n"/></svg>
      <svg class="cl-icon"><use href="#cl-r"/></svg>
    </div>
    <div class="board" id="board">
      <div class="squares" id="squares"></div>
      <div class="layer" id="marks"></div>
      <div class="layer" id="items"></div>
      <div class="layer" id="pieces"></div>
      <div class="layer" id="footprints"></div>
      <div class="layer" id="fx"></div>
      <div class="layer" id="guide"></div>
    </div>
    <div class="strip strip-home" id="strip-home" aria-hidden="true">
      <svg class="cl-icon"><use href="#cl-r"/></svg>
      <svg class="cl-icon"><use href="#cl-n"/></svg>
      <svg class="cl-icon"><use href="#cl-b"/></svg>
      <svg class="cl-icon"><use href="#cl-q"/></svg>
      <svg class="cl-icon"><use href="#cl-k"/></svg>
      <svg class="cl-icon"><use href="#cl-b"/></svg>
      <svg class="cl-icon"><use href="#cl-n"/></svg>
      <svg class="cl-icon"><use href="#cl-r"/></svg>
    </div>
    <div class="overlay" id="overlay" hidden>
      <div class="dim" id="dim"></div>
      <div class="card" id="card" role="button" tabindex="0"></div>
    </div>
  </section>

  <nav class="panel" id="panel" aria-label="Mission and pieces">
    <div class="mission" id="mission-box">
      <div class="portrait" id="portrait"></div>
      <div class="goal" id="goal"></div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="tools">
      <button class="tool" id="tool-replay" type="button" aria-label="Watch again"></button>
      <button class="tool" id="tool-skip" type="button" aria-label="Skip" hidden></button>
      <button class="tool tool-lang" id="lang-toggle" type="button" aria-label="Language">
        <span class="lang-glyph" id="lang-glyph"></span>
      </button>
      <button class="tool" id="sound-toggle" type="button" aria-pressed="true" aria-label="Sound"></button>
      <button class="tool" id="home-toggle" type="button" aria-label="Home"></button>
    </div>
  </nav>
</main>

<div class="homescreen" id="homescreen">
  <div class="corner">
    <button class="tool tool-lang" id="home-lang-toggle" type="button" aria-label="Language">
      <span class="lang-glyph" id="home-lang-glyph"></span>
    </button>
    <button class="tool" id="home-sound-toggle" type="button" aria-pressed="true" aria-label="Sound"></button>
    <a class="tool tool-lang" id="help-link" href="help.html" aria-label="Help for grown-ups">?</a>
  </div>
  <div class="logo">
    <div class="feet"><span></span><span></span></div>
    <h1>Footprint Chess</h1>
  </div>
  <div class="home-cards" id="home-cards"></div>
</div>

<script src="js/rules.js"></script>
<script src="js/levels.js"></script>
<script src="js/lessons.js"></script>
<script src="js/sound.js"></script>
<script src="js/voice-clips.js"></script>
<script src="js/voice.js"></script>
<script src="js/board.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
