    <!-- Eye for the "Watch" badge: white eye, pupil in currentColor. -->
    <symbol id="ic-eye" viewBox="0 0 100 100">
      <path d="M6 50 C22 24 78 24 94 50 C78 76 22 76 6 50 Z" fill="#ffffff"/>
      <circle cx="50" cy="50" r="16" fill="currentColor"/>
      <circle cx="56" cy="44" r="5" fill="#ffffff"/>
    </symbol>

    <symbol id="ic-skip" viewBox="0 0 100 100">
      <path d="M13 20 L50 50 L13 80 Z" fill="currentColor"/>
      <path d="M50 20 L87 50 L50 80 Z" fill="currentColor"/>
    </symbol>

    <!-- Tools: replay ("again"), home, play/go, meet-card arrow. -->
    <symbol id="again" viewBox="0 0 100 100"><path d="M76 50 A26 26 0 1 1 64 28" stroke="currentColor" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M52 12 L78 22 L62 44 Z" fill="currentColor"/></symbol>
    <symbol id="house" viewBox="0 0 100 100"><path d="M14 50 L50 16 L86 50 V86 H60 V62 H40 V86 H14 Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/></symbol>
    <symbol id="play-tri" viewBox="0 0 100 100"><path d="M24 12 L88 50 L24 88 Z" fill="currentColor" stroke="currentColor" stroke-width="10" stroke-linejoin="round"/></symbol>
    <!-- Stage 8: take back a move (the growing battle): an arrow curling back. -->
    <symbol id="ic-undo" viewBox="0 0 100 100"><path d="M30 40 H62 A20 20 0 0 1 62 80 H40" stroke="currentColor" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M12 40 L36 20 V60 Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/></symbol>
    <symbol id="arrow" viewBox="0 0 100 100"><path d="M14 50 H74 M56 28 L80 50 L56 72" stroke="currentColor" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <!-- Stage 5: the sticker book button (Home), the tick on a met piece's
         card, and the grown-ups' corner's lock and close icons. -->
    <symbol id="ic-book" viewBox="0 0 100 100">
      <path d="M50 26 C40 18 24 16 12 20 V80 C24 76 40 78 50 86 C60 78 76 76 88 80 V20 C76 16 60 18 50 26 Z" fill="#ffffff" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
      <path d="M50 26 V86" stroke="currentColor" stroke-width="6"/>
      <circle cx="31" cy="46" r="9" fill="#f2c14e" stroke="currentColor" stroke-width="4"/>
      <circle cx="69" cy="54" r="9" fill="#ec5f99" stroke="currentColor" stroke-width="4"/>
    </symbol>
    <symbol id="ic-check" viewBox="0 0 100 100"><path d="M20 53 L42 75 L82 27" stroke="currentColor" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-lock" viewBox="0 0 100 100"><rect x="22" y="44" width="56" height="42" rx="8" fill="none" stroke="currentColor" stroke-width="6"/><path d="M34 44 V32 a16 16 0 0 1 32 0 V44" fill="none" stroke="currentColor" stroke-width="6"/></symbol>
    <!-- Stage 6: the tip button on a game's Won card (a light bulb). -->
    <symbol id="ic-bulb" viewBox="0 0 100 100"><path d="M50 10 C31 10 18 24 18 41 C18 53 25 61 32 68 C35 71 36 74 36 78 H64 C64 74 65 71 68 68 C75 61 82 53 82 41 C82 24 69 10 50 10 Z" fill="#ffe066" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><path d="M38 86 H62 M42 94 H58" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><path d="M40 44 Q50 34 60 44" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round"/></symbol>
    <!-- Stage 7: the hand prints of the left/right levels. A left hand seen
         from the back, as the child holds it up: fingers up, thumb toward
         the middle. The right hand is the same shape mirrored (css/app.css). -->
    <symbol id="ic-palm" viewBox="0 0 100 100"><g fill="currentColor" stroke="#1d2b36" stroke-width="3" stroke-linejoin="round"><rect x="70" y="46" width="13" height="32" rx="6.5" transform="rotate(-38 76 62)"/><rect x="22" y="26" width="12" height="36" rx="6"/><rect x="35" y="12" width="12" height="46" rx="6"/><rect x="48" y="8" width="12" height="48" rx="6"/><rect x="61" y="14" width="12" height="44" rx="6"/><rect x="22" y="44" width="52" height="48" rx="18"/></g></symbol>
    <symbol id="ic-close" viewBox="0 0 100 100"><path d="M24 24 L76 76 M76 24 L24 76" stroke="currentColor" stroke-width="9" stroke-linecap="round" fill="none"/></symbol>
  </defs>
</svg>

<div class="blob blob-a" aria-hidden="true"></div>
<div class="blob blob-b" aria-hidden="true"></div>

<main class="app" id="app">
  <section class="scene" id="scene" aria-label="Board">
    <!-- Who is in control: a purple ring and "Watch" badge while the app
         shows, a green ring and "Your turn!" badge when the child acts. -->
    <div class="scene-ring ring-watch" aria-hidden="true"></div>
    <div class="scene-ring ring-play" aria-hidden="true"></div>
    <div class="mode-badge" id="mode-badge" aria-live="polite" hidden>
      <svg class="mode-icon" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use id="mode-icon-use" href="#ic-eye"/></svg>
      <span id="mode-text"></span>
    </div>
    <div class="strip strip-far" id="strip-far" aria-hidden="true">
      <svg class="cl-icon"><use href="#cl-r"/></svg>
      <svg class="cl-icon"><use href="#cl-n"/></svg>
      <svg class="cl-icon"><use href="#cl-b"/></svg>
      <svg class="cl-icon"><use href="#cl-q"/></svg>
      <svg class="cl-icon"><use href="#cl-k"/></svg>
      <svg class="cl-icon"><use href="#cl-b"/></svg>
      <svg class="cl-icon"><use href="#cl-n"/></svg>
      <svg class="cl-icon"><use href="#cl-r"/></svg>
      <!-- Pirate theme only (see css/app.css): two ship hulls stand in for
           the edge strips, the other side's dark hull above the board. -->
      <svg class="hull hull-far" viewBox="0 0 280 26" preserveAspectRatio="none" aria-hidden="true" focusable="false"><rect width="280" height="26" fill="#3a2618"/><path d="M0 9 H280 M0 18 H280" stroke="#2a1b10" stroke-width="1.5"/><rect x="12" y="10" width="16" height="11" rx="2" fill="#120c08"/><rect x="17" y="2" width="6" height="9" rx="2" fill="#1d1a18"/><rect x="52" y="10" width="16" height="11" rx="2" fill="#120c08"/><rect x="57" y="2" width="6" height="9" rx="2" fill="#1d1a18"/><rect x="92" y="10" width="16" height="11" rx="2" fill="#120c08"/><rect x="97" y="2" width="6" height="9" rx="2" fill="#1d1a18"/><rect x="132" y="10" width="16" height="11" rx="2" fill="#120c08"/><rect x="137" y="2" width="6" height="9" rx="2" fill="#1d1a18"/><rect x="172" y="10" width="16" height="11" rx="2" fill="#120c08"/><rect x="177" y="2" width="6" height="9" rx="2" fill="#1d1a18"/><rect x="212" y="10" width="16" height="11" rx="2" fill="#120c08"/><rect x="217" y="2" width="6" height="9" rx="2" fill="#1d1a18"/><rect x="252" y="10" width="16" height="11" rx="2" fill="#120c08"/><rect x="257" y="2" width="6" height="9" rx="2" fill="#1d1a18"/></svg>
      <!-- Games (stage 3): a team bar, filled in by js/board.js
           (showTeamBars), shown only during a game or the "turns" lesson. -->
      <!-- Mirror Pond (stage 7): a still pond showing the other side's
           pieces reflected, during the other side's view games. -->
      <div class="pond" id="pond" hidden></div>
      <div class="team-bar" id="team-bar-far" hidden></div>
    </div>
    <div class="board" id="board">
      <div class="squares" id="squares"></div>
      <div class="layer" id="marks"></div>
      <div class="layer" id="items"></div>
      <div class="layer" id="pieces"></div>
      <div class="layer" id="footprints"></div>
      <div class="layer" id="fx"></div>
      <div class="layer" id="guide"></div>
    </div>
    <div class="strip strip-home" id="strip-home" aria-hidden="true">
      <svg class="cl-icon"><use href="#cl-r"/></svg>
      <svg class="cl-icon"><use href="#cl-n"/></svg>
      <svg class="cl-icon"><use href="#cl-b"/></svg>
      <svg class="cl-icon"><use href="#cl-q"/></svg>
      <svg class="cl-icon"><use href="#cl-k"/></svg>
      <svg class="cl-icon"><use href="#cl-b"/></svg>
      <svg class="cl-icon"><use href="#cl-n"/></svg>
      <svg class="cl-icon"><use href="#cl-r"/></svg>
      <!-- Pirate theme only: your side's light hull, below the board. -->
      <svg class="hull hull-home" viewBox="0 0 280 26" preserveAspectRatio="none" aria-hidden="true" focusable="false"><rect width="280" height="26" fill="#c9965c"/><path d="M0 9 H280 M0 18 H280" stroke="#a87843" stroke-width="1.5"/><rect x="12" y="4" width="16" height="11" rx="2" fill="#5b3a1e"/><rect x="17" y="14" width="6" height="9" rx="2" fill="#1d1a18"/><rect x="52" y="4" width="16" height="11" rx="2" fill="#5b3a1e"/><rect x="57" y="14" width="6" height="9" rx="2" fill="#1d1a18"/><rect x="92" y="4" width="16" height="11" rx="2" fill="#5b3a1e"/><rect x="97" y="14" width="6" height="9" rx="2" fill="#1d1a18"/><rect x="132" y="4" width="16" height="11" rx="2" fill="#5b3a1e"/><rect x="137" y="14" width="6" height="9" rx="2" fill="#1d1a18"/><rect x="172" y="4" width="16" height="11" rx="2" fill="#5b3a1e"/><rect x="177" y="14" width="6" height="9" rx="2" fill="#1d1a18"/><rect x="212" y="4" width="16" height="11" rx="2" fill="#5b3a1e"/><rect x="217" y="14" width="6" height="9" rx="2" fill="#1d1a18"/><rect x="252" y="4" width="16" height="11" rx="2" fill="#5b3a1e"/><rect x="257" y="14" width="6" height="9" rx="2" fill="#1d1a18"/></svg>
      <div class="team-bar" id="team-bar-home" hidden></div>
      <!-- Stage 7, hand-print levels only: the child's left and right hands,
           at the two ends of their own side (js/board.js showHandPrints). -->
      <div class="hand-print hand-left" id="hand-left" hidden><svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#ic-palm"/></svg></div>
      <div class="hand-print hand-right" id="hand-right" hidden><svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#ic-palm"/></svg></div>
    </div>
    <div class="overlay" id="overlay" hidden>
      <div class="dim" id="dim"></div>
      <div class="card" id="card" role="button" tabindex="0"></div>
    </div>
  </section>

  <nav class="panel" id="panel" aria-label="Mission and pieces">
    <div class="mission" id="mission-box">
      <div class="portrait" id="portrait"></div>
      <div class="goal" id="goal"></div>
      <!-- Games (stage 3): the capture jar (js/games-ui.js), fills 0-10 as
           pawns are captured across games and capture rounds alike; purely
           visual (no numbers), empties into a sticker when full. -->
      <div class="jar" id="game-jar" aria-hidden="true">
        <div class="jar-fill" id="game-jar-fill"></div>
      </div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="tools">
      <button class="tool" id="tool-replay" type="button" aria-label="Watch again"></button>
      <button class="tool" id="tool-skip" type="button" aria-label="Skip" hidden></button>
      <button class="tool" id="tool-undo" type="button" aria-label="Take back" hidden></button>
      <button class="tool tool-lang" id="lang-toggle" type="button" aria-label="Language">
        <span class="lang-glyph" id="lang-glyph"></span>
      </button>
      <button class="tool" id="sound-toggle" type="button" aria-pressed="true" aria-label="Sound"></button>
      <button class="tool" id="home-toggle" type="button" aria-label="Home"></button>
    </div>
  </nav>
</main>

<div class="homescreen" id="homescreen">
  <!-- Stage 5: the child's own picture (js/profile-ui.js fills it); tapping it
       opens the Who's playing screen. -->
  <button class="me-chip" id="me-chip" type="button" aria-label="Who is playing"></button>
  <div class="corner">
    <button class="tool tool-book" id="book-toggle" type="button" aria-label="Sticker book"></button>
    <button class="tool" id="theme-toggle" type="button" aria-label="Theme"></button>
    <button class="tool tool-lang" id="home-lang-toggle" type="button" aria-label="Language">
      <span class="lang-glyph" id="home-lang-glyph"></span>
    </button>
    <button class="tool" id="home-sound-toggle" type="button" aria-pressed="true" aria-label="Sound"></button>
    <a class="tool tool-lang help-link" id="help-link" href="help.html" aria-label="Help for grown-ups">?<span class="hold-ring" aria-hidden="true"></span></a>
  </div>
  <!-- Theme picker: no visible text, ever (a theme's own English name would
       have to appear in an aria-label only). js/app.js fills this with one
       round swatch per FC.themes.THEMES entry. -->
  <div class="theme-row" id="theme-row" hidden></div>
  <div class="logo">
    <div class="feet"><span></span><span></span></div>
    <h1>Footprint Chess</h1>
  </div>
  <div class="home-cards" id="home-cards"></div>
  <!-- Games (stage 6): one Games button, filled in by js/games-ui.js,
       which opens the Games screen. The sticker shelf shows underneath once
       there are any stickers. -->
  <div class="home-cards home-games" id="home-games"></div>
  <div class="sticker-row" id="sticker-row" hidden></div>
</div>

<!-- Games screen (stage 6; js/games-ui.js): one row per kind of game
     (capture, reach the other side, thinking), each marked with a picture,
     never a word. Every game can be tapped. -->
<div class="gamescreen" id="gamescreen" hidden>
  <button class="tool games-home" id="games-home" type="button" aria-label="Home"></button>
  <div class="game-rows" id="game-rows"></div>
  <!-- The growing battle (stage 8): its levels as a ladder beside the rows
       (below them in portrait), built by js/games-ui.js. -->
  <div class="army-ladder" id="army-ladder"></div>
</div>

<!-- Who's playing (stage 5; js/profile-ui.js): full screen like the home
     screen. Shown at startup only when there are two or more children, and
     opened from the child's picture on Home. No add or remove controls here:
     those are in the grown-ups' corner. -->
<div class="whoscreen" id="whoscreen" hidden>
  <div class="corner">
    <a class="tool tool-lang help-link" id="who-help" href="help.html" aria-label="Help for grown-ups">?<span class="hold-ring" aria-hidden="true"></span></a>
  </div>
  <h1 class="who-title" id="who-title"></h1>
  <div class="who-row" id="who-row"></div>
</div>

<!-- Sticker book (stage 5; js/book-ui.js): one tab per theme, two pages of
     four slots. No numbers anywhere. -->
<div class="bookscreen" id="bookscreen" hidden>
  <button class="tool book-home" id="book-home" type="button" aria-label="Home"></button>
  <div class="book-me" id="book-me" aria-hidden="true"></div>
  <div class="book-tabs" id="book-tabs" role="group" aria-label="Themes"></div>
  <div class="book" id="book"></div>
</div>

<!-- The grown-ups' corner (stage 5; js/grownups-ui.js builds the panel):
     opened by holding the ? button for two seconds, or from help.html. -->
<div class="gu" id="grownups" hidden></div>

<!-- Language picker: shown only when the registry (js/langs.js) has three or
     more languages; with two, the language button just switches. No visible
     text, ever: each button shows one glyph and carries the language name as
     an aria-label. js/app.js fills this. -->
<div class="lang-row" id="lang-row" hidden></div>
